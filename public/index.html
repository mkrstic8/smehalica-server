<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Смехалица укрштеница — Online</title>
    
    <!-- Socket.IO klijent -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Capacitor global -->
    <script src="https://unpkg.com/@capacitor/core/dist/global.js"></script>
    
    <style>
        /* Tvoj postojeći CSS je identičan, možeš ga ostaviti bez izmena */
        /* Ovde ga neću ponavljati da odgovor ne bude predugačak */
    </style>
</head>
<body>

    <!-- HTML deo ostaje isti kao u tvom fajlu -->

    <script>
        // ==================== KONEKCIJA ====================
        const SERVER_URL = 'https://smehalica-server.onrender.com';
        
        // Trajni playerId i playerName
        let playerId = localStorage.getItem('smehalica_playerId');
        let myName = localStorage.getItem('smehalica_playerName') || 'Играч';
        
        const socket = io(SERVER_URL, {
            auth: { playerId },
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionAttempts: Infinity,
            timeout: 10000
        });

        // ==================== STANJE ====================
        let gameId = null;
        let myRack = [];
        let isMyTurn = false;
        let selectedTileIndex = null;
        let newlyPlacedCells = [];
        let gameActive = false;
        let gameIsOver = false;
        let lastMoveCells = [];
        let currentBoardState = null;
        let waitingRack = [];
        let myRoomLink = null;

        const letterValues = {
            'А':1,'Б':3,'В':2,'Г':3,'Д':2,'Ђ':8,'Е':1,'Ж':5,'З':3,
            'И':1,'Ј':3,'К':2,'Л':2,'Љ':5,'М':2,'Н':1,'Њ':5,'О':1,
            'П':2,'Р':1,'С':1,'Т':1,'Ћ':10,'У':1,'Ф':5,'Х':4,'Ц':4,
            'Ч':4,'Џ':8,'Ш':4
        };

        // ==================== POMOĆNE FUNKCIJE ====================
        function sendMessage(type, data = {}) {
            if (socket.connected) {
                socket.emit(type, data);
            } else {
                console.warn('Socket nije povezan');
            }
        }

        function showScreen(screenId) {
            // Sakrij sve overlay ekrane
            document.querySelectorAll('.overlay-content').forEach(el => el.style.display = 'none');
            document.getElementById('nameOverlay').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'none';
            
            if (screenId === 'game') {
                document.getElementById('gameContainer').style.display = 'flex';
                document.getElementById('nameOverlay').style.display = 'none';
            } else {
                document.getElementById('nameOverlay').style.display = 'flex';
                if (screenId) {
                    document.getElementById(screenId).style.display = 'block';
                }
            }
        }

        // ==================== SOCKET EVENTI ====================
        socket.on('connect', () => {
            console.log('🟢 Socket povezan');
            document.getElementById('connectionStatus').innerHTML =
                '<span class="connection-dot connected"></span> Повезан';
            
            // Ako imamo sačuvano ime, odmah ga pošalji
            if (myName && myName !== 'Играч') {
                sendMessage('set_name', { name: myName });
            }
        });

        socket.on('disconnect', (reason) => {
            console.log('🔴 Socket diskonektovan:', reason);
            document.getElementById('connectionStatus').innerHTML =
                '<span class="connection-dot disconnected"></span> Веза прекинута...';
            gameActive = false;
        });

        socket.on('connected', (data) => {
            playerId = data.playerId;
            localStorage.setItem('smehalica_playerId', playerId);
            console.log('🔑 Moj playerId:', playerId);
        });

        socket.on('error', (data) => {
            console.error('Server greška:', data.message);
            errorMsg(data.message);
        });

        socket.on('game_start', (msg) => {
            startGame(msg);
        });

        socket.on('move_result', (msg) => {
            updateGameState(msg);
            if (msg.lastMoveWords && msg.lastMoveWords.length > 0) {
                const isMyMove = msg.lastMovePlayerName === myName;
                if (isMyMove) {
                    sfxValid();
                    if (msg.lastMove && msg.lastMove.placements) {
                        msg.lastMove.placements.forEach(p => {
                            animateCell(p.row, p.col, 'bounce');
                            const cellEl = document.querySelector(`.cell[data-row="${p.row}"][data-col="${p.col}"]`);
                            if (cellEl) {
                                const rect = cellEl.getBoundingClientRect();
                                spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, '#FFD700', 8);
                            }
                        });
                    }
                    addChatSystemMsg(`🎯 Ти играш: ${msg.lastMoveWords.join(', ')} (+${msg.lastMoveScore})`);
                } else {
                    sfxOpponent();
                    addChatSystemMsg(`${msg.lastMovePlayerName} игра: ${msg.lastMoveWords.join(', ')} (+${msg.lastMoveScore})`);
                }
            }
        });

        socket.on('move_invalid', (msg) => {
            sfxInvalid();
            newlyPlacedCells.forEach(p => animateCell(p.row, p.col, 'shake'));
            errorMsg('❌ Неважећи потез: ' + msg.error);
            requestStateFromServer();
        });

        socket.on('turn_skipped', (msg) => {
            updateGameState(msg);
            addChatSystemMsg(`${msg.skippedByName} прескаче потез.`);
        });

        socket.on('game_over', (msg) => {
            updateGameState(msg);
            showGameOver(msg);
            if (msg.resultMessage && msg.resultMessage.includes('Победио')) {
                sfxWin();
                setTimeout(spawnConfetti, 500);
            }
        });

        socket.on('game_state', (msg) => {
            updateGameState(msg);
            // Ako je igra aktivna, a mi nismo na tabli, prikaži tablu
            if (msg.status === 'active' && !gameActive) {
                startGame(msg);
            }
        });

        socket.on('chat_message', (msg) => {
            addChatMessage(msg.from, msg.text);
        });

        socket.on('room_created', (msg) => {
            myRoomLink = msg.roomLink;
            document.getElementById('roomLinkDisplay').textContent = msg.roomLink;
            document.getElementById('roomStatus').textContent = msg.message;
            document.getElementById('copyLinkBtn').style.display = 'block';
        });

        socket.on('opponent_left', (msg) => {
            removeRematchButton();
            const oldMenuBtn3 = document.getElementById('menuBtn');
            if (oldMenuBtn3) oldMenuBtn3.remove();
            const controls = document.querySelector('.controls');
            let menuBtn2 = document.getElementById('menuBtn');
            if (!menuBtn2) {
                menuBtn2 = document.createElement('button');
                menuBtn2.id = 'menuBtn';
                menuBtn2.className = 'btn-light';
                menuBtn2.textContent = '🏠 POČETNI MENI';
                menuBtn2.onclick = () => goToMainMenu();
                controls.appendChild(menuBtn2);
            }
            permanentMsg('🚪 Противник је напустио игру.');
        });

        socket.on('rematch_request', (msg) => {
            showRematchRequest(msg);
        });

        socket.on('rematch_accepted', (msg) => {
            hideRematchRequest();
            addChatSystemMsg('🔄 Реванш прихваћен! Нова игра почиње.');
            removeRematchButton();
        });

        socket.on('rematch_declined', (msg) => {
            hideRematchRequest();
            addChatSystemMsg('❌ Реванш одбијен.');
            setMessage('❌ Противник је одбио реванш.', 'info', 3000);
            removeRematchButton();
        });

        socket.on('rematch_sent', (msg) => {
            setMessage(msg.message, 'info', 2000);
        });

        socket.on('pong', () => {});

        // ==================== INICIJALIZACIJA ====================
        function initialSetup() {
            // Ako imamo sačuvano ime, automatski pošalji i preskoči ekran za ime
            if (myName && myName !== 'Играч') {
                document.getElementById('nameInput').value = myName;
                showScreen('optionsScreen');
                sendMessage('set_name', { name: myName });
            } else {
                showScreen('nameScreen');
            }
        }

        // ==================== UI FUNKCIJE ====================
        function showGameOptions() {
            myName = document.getElementById('nameInput').value.trim() || 'Играч';
            localStorage.setItem('smehalica_playerName', myName);
            sendMessage('set_name', { name: myName });
            showScreen('optionsScreen');
        }
        
        function goBackToName() {
            showScreen('nameScreen');
        }
        
        function goBackToOptions() {
            showScreen('optionsScreen');
        }
        
        function quickMatch() {
            showScreen('findingScreen');
            waitingRack = [];
            const allLetters = 'АБВГДЂЕЖЗИЈКЛЉМНЊОПРСТЋУФХЦЧЏШ';
            for (let i = 0; i < 8; i++) {
                waitingRack.push(allLetters[Math.floor(Math.random() * allLetters.length)]);
            }
            renderWaitingRack();
            sendMessage('quick_match');
        }
        
        function showCreateRoom() {
            showScreen('createRoomScreen');
            document.getElementById('roomStatus').textContent = 'Креирам собу...';
            sendMessage('create_room');
        }
        
        function showJoinRoom() {
            showScreen('joinRoomScreen');
            document.getElementById('roomLinkInput').value = '';
            document.getElementById('joinStatus').textContent = '';
        }
        
        function joinRoom() {
            const link = document.getElementById('roomLinkInput').value.trim().toUpperCase();
            if (link.length !== 5) {
                document.getElementById('joinStatus').textContent = 'Линк мора имати 5 слова!';
                return;
            }
            document.getElementById('joinStatus').textContent = 'Придруживање...';
            sendMessage('join_room', { roomLink: link });
        }
        
        function copyRoomLink() {
            if (myRoomLink) {
                navigator.clipboard.writeText(myRoomLink).then(() => {
                    document.getElementById('roomStatus').textContent = 'Линк копиран! ✓';
                }).catch(() => {
                    document.getElementById('roomStatus').textContent = 'Линк: ' + myRoomLink;
                });
            }
        }
        
        function cancelRoom() {
            sendMessage('cancel_find');
            showScreen('optionsScreen');
            myRoomLink = null;
        }
        
        function renderWaitingRack() {
            const rackEl = document.getElementById('waitingRack');
            if (!rackEl) return;
            rackEl.innerHTML = '';
            waitingRack.forEach(letter => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = letter;
                tile.style.cursor = 'default';
                rackEl.appendChild(tile);
            });
        }
        
        function shuffleWaitingRack() {
            for (let i = waitingRack.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [waitingRack[i], waitingRack[j]] = [waitingRack[j], waitingRack[i]];
            }
            renderWaitingRack();
        }

        function cancelFind() {
            sendMessage('cancel_find');
            showScreen('optionsScreen');
            waitingRack = [];
        }

        function startGame(msg) {
            showScreen('game');
            gameId = msg.gameId;
            gameActive = true;
            gameIsOver = false;
            document.getElementById('yourNameLabel').textContent = '👤 Ти';
            document.getElementById('opponentNameLabel').textContent = '🤖 ' + msg.opponentName;
            updateGameState(msg);
            setMessage('🎮 Игра почиње! ' + (msg.isYourTurn ? 'Ти си на потезу.' : 'Противник је на потезу.'), 'info', 3000);
            highlightRack();
        }

        function updateGameState(msg) {
            if (msg.board) renderBoardFromState(msg.board);
            if (msg.yourRack) myRack = [...msg.yourRack];
            if (msg.yourScore !== undefined) document.getElementById('yourScore').textContent = msg.yourScore;
            if (msg.opponentScore !== undefined) document.getElementById('opponentScore').textContent = msg.opponentScore;
            if (msg.bagCount !== undefined) document.getElementById('tilesLeft').textContent = msg.bagCount;
            if (msg.isYourTurn !== undefined) {
                isMyTurn = msg.isYourTurn;
                updateTurnIndicator(msg.isYourTurn);
                document.getElementById('btnSubmit').disabled = !isMyTurn;
                document.getElementById('btnSkip').disabled = !isMyTurn;
                document.getElementById('btnRecall').disabled = !isMyTurn;
            }
            if (msg.gameOver) {
                gameIsOver = true;
                gameActive = false;
                document.getElementById('btnSubmit').disabled = true;
                document.getElementById('btnSkip').disabled = true;
                document.getElementById('btnRecall').disabled = true;
            }
            if (msg.lastMove && msg.lastMove.placements) {
                lastMoveCells = msg.lastMove.placements.map(p => ({ row: p.row, col: p.col }));
            } else {
                lastMoveCells = [];
            }
            newlyPlacedCells = [];
            selectedTileIndex = null;
            renderMyRack();
        }

        function renderBoardFromState(boardState) {
            currentBoardState = boardState;
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            const bonusBoard = [
                ['TW','','','DL','','','','TW','','','','DL','','','TW'],
                ['','DW','','','','TL','','','','TL','','','','DW',''],
                ['','','DW','','','','DL','','DL','','','','DW','',''],
                ['DL','','','DW','','','','DL','','','','DW','','','DL'],
                ['','','','','DW','','','','','','DW','','','',''],
                ['','TL','','','','TL','','','','TL','','','','TL',''],
                ['','','DL','','','','DL','','DL','','','','DL','',''],
                ['TW','','','DL','','','','★','','','','DL','','','TW'],
                ['','','DL','','','','DL','','DL','','','','DL','',''],
                ['','TL','','','','TL','','','','TL','','','','TL',''],
                ['','','','','DW','','','','','','DW','','','',''],
                ['DL','','','DW','','','','DL','','','','DW','','','DL'],
                ['','','DW','','','','DL','','DL','','','','DW','',''],
                ['','DW','','','','TL','','','','TL','','','','DW',''],
                ['TW','','','DL','','','','TW','','','','DL','','','TW'],
            ];

            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const bonus = bonusBoard[r][c];
                    if (bonus === 'TW') cell.classList.add('tw');
                    else if (bonus === 'DW') cell.classList.add('dw');
                    else if (bonus === 'TL') cell.classList.add('tl');
                    else if (bonus === 'DL') cell.classList.add('dl');
                    else if (bonus === '★') cell.classList.add('star');

                    if (boardState[r] && boardState[r][c]) {
                        cell.textContent = boardState[r][c].letter;
                        cell.classList.add('occupied');
                        const pointSpan = document.createElement('span');
                        pointSpan.className = 'cell-point';
                        pointSpan.textContent = letterValues[boardState[r][c].letter] || 0;
                        cell.appendChild(pointSpan);
                    }

                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => onCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
            
            for (const p of newlyPlacedCells) {
                const cell = boardEl.querySelector(`[data-row="${p.row}"][data-col="${p.col}"]`);
                if (cell) {
                    cell.textContent = p.letter;
                    cell.classList.add('occupied', 'newly-placed');
                    let pointSpan = cell.querySelector('.cell-point');
                    if (!pointSpan) {
                        pointSpan = document.createElement('span');
                        pointSpan.className = 'cell-point';
                        cell.appendChild(pointSpan);
                    }
                    pointSpan.textContent = letterValues[p.letter] || 0;
                }
            }
        }

        function renderMyRack() {
            const rackEl = document.getElementById('rack');
            rackEl.innerHTML = '';
            myRack.forEach((letter, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tile-wrapper';
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (index === selectedTileIndex) tile.classList.add('selected');
                tile.textContent = letter;
                tile.addEventListener('click', (e) => {
                    e.stopPropagation();
                    onRackClick(index);
                });
                const points = document.createElement('div');
                points.className = 'tile-point';
                points.textContent = letterValues[letter] || 0;

                wrapper.appendChild(tile);
                wrapper.appendChild(points);
                rackEl.appendChild(wrapper);
            });
        }

        function updateTurnIndicator(myTurn) {
            const indicator = document.getElementById('turnIndicator');
            const yBox = document.getElementById('yourScoreBox');
            const oBox = document.getElementById('opponentScoreBox');
            indicator.classList.remove('your-turn', 'opponent-turn', 'game-over-state');
            if (gameIsOver) {
                indicator.textContent = '🏁 КРАЈ ИГРЕ';
                indicator.classList.add('game-over-state');
                yBox.classList.remove('active-player');
                oBox.classList.remove('active-player');
            } else if (myTurn) {
                indicator.textContent = '🔵 ТВОЈ ПОТЕЗ';
                indicator.classList.add('your-turn');
                yBox.classList.add('active-player');
                oBox.classList.remove('active-player');
            } else {
                indicator.textContent = '🟠 ПРОТИВНИК НА ПОТЕЗУ';
                indicator.classList.add('opponent-turn');
                yBox.classList.remove('active-player');
                oBox.classList.add('active-player');
            }
        }

        let messageTimeout = null;
        function setMessage(msg, type, duration = 3000) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message-box';
            if (type) el.classList.add(type);
            if (messageTimeout) clearTimeout(messageTimeout);
            if (duration > 0) {
                messageTimeout = setTimeout(() => {
                    el.textContent = '';
                    el.className = 'message-box';
                }, duration);
            }
        }
        function quickMsg(msg) { setMessage(msg, '', 1500); }
        function successMsg(msg) { setMessage(msg, 'success', 3000); }
        function errorMsg(msg) { setMessage(msg, 'error', 3000); }
        function permanentMsg(msg, type = 'info') { setMessage(msg, type, 0); }

        // ==================== INTERAKCIJE ====================
        function onRackClick(index) {
            if (!isMyTurn || !gameActive || gameIsOver) return;
            selectedTileIndex = (selectedTileIndex === index) ? null : index;
            renderMyRack();
        }

        function onCellClick(row, col) {
            if (!isMyTurn || !gameActive || gameIsOver) {
                setMessage('⏳ Није твој потез!', 'error');
                return;
            }
            const boardState = currentBoardState;
            const isOccupiedPermanently = boardState && boardState[row] && boardState[row][col];
            const isNewlyPlacedByMe = newlyPlacedCells.some(p => p.row === row && p.col === col);

            if (selectedTileIndex === null) {
                if (isNewlyPlacedByMe) {
                    const existingIdx = newlyPlacedCells.findIndex(p => p.row === row && p.col === col);
                    if (existingIdx >= 0) {
                        myRack.push(newlyPlacedCells[existingIdx].letter);
                        newlyPlacedCells.splice(existingIdx, 1);
                        renderBoardFromState(boardState);
                        renderMyRack();
                        quickMsg('↩ Плочица враћена на сталак.');
                    }
                } else if (isOccupiedPermanently) {
                    errorMsg('⚠ То поље је већ заузето.');
                } else {
                    errorMsg('👆 Прво изабери плочицу са сталке!');
                }
                return;
            }
            if (isOccupiedPermanently && !isNewlyPlacedByMe) {
                errorMsg('⚠ То поље је већ заузето.');
                return;
            }
            if (isNewlyPlacedByMe) {
                const existingIdx = newlyPlacedCells.findIndex(p => p.row === row && p.col === col);
                if (existingIdx >= 0) {
                    myRack.push(newlyPlacedCells[existingIdx].letter);
                    newlyPlacedCells.splice(existingIdx, 1);
                }
            }
            const letter = myRack[selectedTileIndex];
            newlyPlacedCells.push({ row, col, letter });
            myRack.splice(selectedTileIndex, 1);
            selectedTileIndex = null;
            renderBoardFromState(boardState);
            renderMyRack();
            sfxPlace();
            animateCell(row, col, 'bounce');
            successMsg(`✅ Постављено "${letter}" (${letterValues[letter] || 0} поен${letterValues[letter] === 1 ? '' : 'а'}).`);
        }

        function recallTiles() {
            if (!isMyTurn || !gameActive || gameIsOver) return;
            if (newlyPlacedCells.length === 0) {
                quickMsg('ℹ Нема новопостављених плочица.');
                return;
            }
            for (const p of [...newlyPlacedCells]) myRack.push(p.letter);
            newlyPlacedCells = [];
            selectedTileIndex = null;
            renderBoardFromState(currentBoardState);
            renderMyRack();
            quickMsg('↩ Све плочице враћене на сталак.');
        }

        function shuffleRack() {
            if (!gameActive || gameIsOver) return;
            for (let i = myRack.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [myRack[i], myRack[j]] = [myRack[j], myRack[i]];
            }
            selectedTileIndex = null;
            renderMyRack();
            quickMsg('🔀 Плочице промешане.');
        }

        function submitMove() {
            if (!isMyTurn || !gameActive || gameIsOver) return;
            if (newlyPlacedCells.length === 0) {
                errorMsg('⚠ Постави бар једно слово на таблу!');
                return;
            }
            const placements = newlyPlacedCells.map(p => ({ row: p.row, col: p.col, letter: p.letter }));
            sendMessage('place_tiles', { placements });
            newlyPlacedCells = [];
            selectedTileIndex = null;
            permanentMsg('⏳ Шаљем потез на проверу...', 'info');
        }

        function skipTurn() {
            if (!isMyTurn || !gameActive || gameIsOver) return;
            if (newlyPlacedCells.length > 0) {
                if (!confirm('Имаш постављене плочице. Сигуран/на да желиш да прескочиш?')) return;
                recallTiles();
            }
            sendMessage('skip_turn');
            setMessage('⏭ Прескачеш потез...', 'info', 2000);
        }

        function resignGame() {
            if (!gameActive) return;
            if (!confirm('Сигуран/на да желиш да се предаш?')) return;
            sendMessage('resign');
            setTimeout(() => {
                showInterstitial();
            }, 300);
        }

        function removeRematchButton() {
            const btn = document.getElementById('rematchBtn');
            if (btn) btn.remove();
        }

        function goToMainMenu() {
            sendMessage('leave_game');
            const rematchBtn = document.getElementById('rematchBtn');
            const menuBtn = document.getElementById('menuBtn');
            if (rematchBtn) rematchBtn.remove();
            if (menuBtn) menuBtn.remove();
            const buttonsToShow = ['btnSubmit', 'btnRecall', 'btnShuffle', 'btnSkip', 'btnResign'];
            buttonsToShow.forEach(btnId => {
                const btn = document.getElementById(btnId);
                if (btn) btn.style.display = '';
            });
            gameActive = false;
            gameIsOver = false;
            myRack = [];
            newlyPlacedCells = [];
            selectedTileIndex = null;
            showScreen('optionsScreen');
        }

        function showGameOver(msg) {
            gameActive = false;
            gameIsOver = true;
            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('btnSkip').disabled = true;
            document.getElementById('btnRecall').disabled = true;
            updateTurnIndicator(false);
            setMessage('🏁 ' + (msg.resultMessage || 'Игра је завршена.'), 'info', 0);
            
            setTimeout(() => {
                showInterstitial();
            }, 1500);
            
            const controls = document.querySelector('.controls');
            let rematchBtn = document.getElementById('rematchBtn');
            if (!rematchBtn) {
                rematchBtn = document.createElement('button');
                rematchBtn.id = 'rematchBtn';
                rematchBtn.className = 'btn-primary';
                rematchBtn.textContent = '🔄 ТРАЖИ РЕВАНШ';
                rematchBtn.onclick = () => {
                    sendMessage('request_rematch');
                    rematchBtn.disabled = true;
                    rematchBtn.textContent = '⏳ Чекам одговор...';
                    setMessage('⏳ Захтев за реванш послат...', 'info', 0);
                };
                controls.appendChild(rematchBtn);
            }
        }

        function showRematchRequest(msg) {
            hideRematchRequest();
            const overlay = document.createElement('div');
            overlay.id = 'rematchOverlay';
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="overlay-content">
                    <h2>🔄 Реванш?</h2>
                    <p style="margin-bottom:15px;"><strong>${msg.fromName}</strong> жели реванш!</p>
                    <button class="btn-success" id="acceptRematchBtn" style="width:100%;padding:12px;margin-bottom:8px;">✅ ПРИХВАТИ</button>
                    <button class="btn-danger" id="declineRematchBtn" style="width:100%;padding:12px;">❌ ОДБИЈ</button>
                </div>
            `;
            document.body.appendChild(overlay);
            document.getElementById('acceptRematchBtn').onclick = () => {
                sendMessage('accept_rematch', { fromId: msg.fromId });
                hideRematchRequest();
                successMsg('🔄 Реванш прихваћен!');
            };
            document.getElementById('declineRematchBtn').onclick = () => {
                sendMessage('decline_rematch', { fromId: msg.fromId });
                hideRematchRequest();
            };
        }

        function hideRematchRequest() {
            const overlay = document.getElementById('rematchOverlay');
            if (overlay) overlay.remove();
        }

        // ==================== CHAT ====================
        function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            sendMessage('chat', { text });
            input.value = '';
        }

        function addChatMessage(from, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.innerHTML = `<strong>${from}:</strong> ${escapeHtml(text)}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addChatSystemMsg(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.style.opacity = '0.7';
            div.style.fontStyle = 'italic';
            div.textContent = '🔹 ' + text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showRules() {
            showScreen('rulesScreen');
        }
        
        function hideRules() {
            showScreen('optionsScreen');
        }

        function requestStateFromServer() {
            sendMessage('get_state');
        }

        // ==================== ZVUCI ====================
        // (isti kao pre, ostavljam ih ovde)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function getAudioCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }
        function playTone(freq, duration, type = 'sine', vol = 0.1) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = vol;
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }
        function sfxPlace() { playTone(600, 0.1, 'sine', 0.08); }
        function sfxValid() { playTone(523, 0.15, 'sine', 0.1); setTimeout(() => playTone(659, 0.15, 'sine', 0.1), 150); setTimeout(() => playTone(784, 0.25, 'sine', 0.12), 300); }
        function sfxInvalid() { playTone(200, 0.3, 'sawtooth', 0.06); setTimeout(() => playTone(150, 0.3, 'sawtooth', 0.06), 200); }
        function sfxWin() { [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => playTone(n, 0.3, 'sine', 0.12), i * 200)); }
        function sfxOpponent() { playTone(440, 0.1, 'triangle', 0.08); setTimeout(() => playTone(380, 0.12, 'triangle', 0.08), 120); setTimeout(() => playTone(320, 0.15, 'triangle', 0.06), 240); }

        // ==================== ANIMACIJE ====================
        function animateCell(row, col, animClass) { const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`); if (cell) { cell.classList.add(animClass); setTimeout(() => cell.classList.remove(animClass), 600); } }
        function spawnParticles(x, y, color, count = 10) { for (let i = 0; i < count; i++) { const particle = document.createElement('div'); particle.className = 'particle'; particle.style.left = x + 'px'; particle.style.top = y + 'px'; particle.style.background = color; particle.style.setProperty('--dx', (Math.random() - 0.5) * 100 + 'px'); particle.style.setProperty('--dy', (Math.random() - 0.5) * 100 - 40 + 'px'); document.body.appendChild(particle); setTimeout(() => particle.remove(), 1100); } }
        function spawnConfetti() { const colors = ['#ff0','#f00','#0f0','#00f','#f0f','#0ff','#ffa500','#ff69b4']; for (let i = 0; i < 40; i++) { setTimeout(() => { const piece = document.createElement('div'); piece.className = 'confetti-piece'; piece.style.cssText = `position: fixed; left: ${Math.random() * 100}%; top: ${Math.random() * 40}%; width: 12px; height: 12px; background: ${colors[Math.floor(Math.random() * colors.length)]}; z-index: 9999; pointer-events: none; animation: confetti ${1.5 + Math.random() * 2}s ease-out forwards; border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};`; document.body.appendChild(piece); setTimeout(() => piece.remove(), 3500); }, i * 25); } }
        function highlightRack() { const rack = document.getElementById('rack'); if (rack) { rack.classList.add('rack-highlight'); setTimeout(() => rack.classList.remove('rack-highlight'), 2500); } }

        // ==================== POKRETANJE ====================
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.tile') && !e.target.closest('#rack') && !e.target.closest('.cell')) {
                selectedTileIndex = null;
                renderMyRack();
            }
        });

        // Capacitor appStateChange (ako postoji)
        try {
            if (window.Capacitor && Capacitor.Plugins.App) {
                const { App } = Capacitor.Plugins;
                App.addListener('appStateChange', ({ isActive }) => {
                    if (!isActive) {
                        console.log('📱 Aplikacija u pozadini, držim socket...');
                    } else {
                        if (!socket.connected) {
                            socket.connect();
                        }
                        if (gameActive) {
                            requestStateFromServer();
                        }
                    }
                });
            }
        } catch (e) {
            console.warn('Capacitor App plugin nije dostupan');
        }

        // Početna inicijalizacija
        initialSetup();
        console.log('🎯 Смехалица укрштеница — Socket.IO klijent spreman!');
    </script>
</body>
</html>
